# JUR-766：judicial-mcp 自動發版改走 Woodpecker（取代 GitHub Actions Release Please）。
# 對齊 coolify-plugin／trailmark 的作法：push main 時先建 GitHub Release（若剛合入 release PR），
# 再開／更新 release PR。token 用全域 secret（只開放 push 事件），PR 事件拿不到。
labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
concurrency:
  limit: 1
steps:
  - name: github-release
    image: oven/bun:1.3.14
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bunx release-please@17.11.2 github-release --token=$GITHUB_API_TOKEN --repo-url=https://github.com/jurislm/judicial-mcp --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
  - name: release-pr
    image: oven/bun:1.3.14
    depends_on:
      - github-release
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bunx release-please@17.11.2 release-pr --token=$GITHUB_API_TOKEN --repo-url=https://github.com/jurislm/judicial-mcp --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
