# JUR-766：驗證 release-please 開的 release PR（標題、作者、分支、只改 3 個檔、版號一致），
# 並等 GitHub Actions 的 lint／test／secret-scan 全綠後才合併。
labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
depends_on:
  - release
concurrency:
  limit: 1
steps:
  - name: merge-release-pr
    image: oven/bun:1.3.14
    environment:
      GITHUB_API_TOKEN:
        from_secret: personal_access_tokens_fine_grained_tokens_jurislm
    commands:
      - bun scripts/ci/run-release-pr-auto-merge.ts
