# JUR-813：tag 時發 npm；manual 只在 main 上，用來補發既有 tag 的版本（check-release-tag 會比對內容）。
# 建置、測試、打包都在沒有 token 的 verify 做；publish 只上傳 verify 打好的 tarball，不跑任何 script。
labels:
  platform: linux/amd64
when:
  - event: tag
  - event: manual
    branch: main
steps:
  - name: verify
    image: oven/bun:1.3.14-alpine
    commands:
      - apk add --no-cache git nodejs npm
      - bun install --frozen-lockfile
      - bun run typecheck
      - bun run test
      - bun run lint
      - bun scripts/ci/check-release-tag.ts
      - bun run build:types
      - mkdir -p .release
      - npm pack --ignore-scripts --pack-destination .release
  - name: publish
    image: oven/bun:1.3.14-alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - apk add --no-cache nodejs npm
      - trap 'rm -f "$HOME/.npmrc"' EXIT
      - printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
      - npm publish .release/*.tgz --access public --ignore-scripts
