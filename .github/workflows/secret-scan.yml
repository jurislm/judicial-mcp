# JUR-763：gitleaks secret 掃描（依 JUR-762 Luca 作法留言 73d2fc6b §3）
# - PR 掃 origin/<base>..HEAD；push 從同分支上一次成功掃描的 head 掃起（JUR-767），
#   前一次被 cancel-in-progress 取消或失敗時，中間的 commit 也會掃到；main 查不到上次成功就掃整段歷史。
# - 範圍底端不在 clone 內時直接失敗。
# - 例外：非 main 分支被強推（如 release-please）時 before 是孤立 commit，改掃 origin/main..sha。
# - 每週 schedule（與 workflow_dispatch）掃全歷史 --all。
# - 一律 --redact；不掛任何 secret；不上傳 artifact；不用 gitleaks-action。
name: Secret Scan

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    # 每週一 05:00 Asia/Taipei（UTC 週日 21:00）
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # zricethezav/gitleaks:v8.30.1（multi-arch index digest）
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test scan range
        run: bash scripts/ci/secret-scan-range.test.sh

      - name: Determine scan range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LAST_SUCCESS_SHA=""
          if [ "$EVENT_NAME" = push ]; then
            LAST_SUCCESS_SHA=$(gh api -X GET "repos/${REPO}/actions/workflows/secret-scan.yml/runs" \
              -f branch="$REF_NAME" -f event=push -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // ""')
            echo "上一次成功掃描：${LAST_SUCCESS_SHA:-（無）}"
          fi
          export LAST_SUCCESS_SHA
          log_opts=$(bash scripts/ci/secret-scan-range.sh)
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"

      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact -v --log-opts="$LOG_OPTS"
