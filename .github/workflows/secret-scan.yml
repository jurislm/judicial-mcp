# JUR-763：gitleaks secret 掃描（依 JUR-762 Luca 作法留言 73d2fc6b §3）
# - PR／push 只掃新增 commit；範圍底端不在 clone 內時直接失敗。
# - 每週 schedule（與 workflow_dispatch）掃全歷史 --all。
# - 一律 --redact；不掛任何 secret；不上傳 artifact；不用 gitleaks-action。
name: Secret Scan

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    # 每週一 05:00 Asia/Taipei（UTC 週日 21:00）
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # zricethezav/gitleaks:v8.30.1（multi-arch index digest）
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              base="origin/${BASE_REF}"
              if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                echo "::error::範圍底端 ${base} 不在 clone 內，停止掃描。"
                exit 1
              fi
              log_opts="${base}..HEAD"
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ]; then
                echo "::warning::退回模式：event.before 為空或全 0（新分支），改掃 -n 100。"
                log_opts="-n 100 ${SHA}"
              else
                if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                  echo "::error::範圍底端 ${BEFORE} 不在 clone 內，停止掃描。"
                  exit 1
                fi
                log_opts="${BEFORE}..${SHA}"
              fi
              ;;
            schedule|workflow_dispatch)
              log_opts="--all"
              ;;
            *)
              echo "::error::未支援的事件 ${EVENT_NAME}"
              exit 1
              ;;
          esac
          # shellcheck disable=SC2086
          count=$(git rev-list --count ${log_opts})
          echo "掃描範圍：--log-opts=\"${log_opts}\"（${count} 個 commit）"
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"

      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact -v --log-opts="$LOG_OPTS"
